[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "google-play-console-mcp"
version = "0.4.1"
description = "MCP server for Google Play Console: 170 tools for releases, Android vitals, earnings, ASO and store assets, with a confirmation gate on destructive writes"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "Abdelraouf Sabri", email = "abdelraoufsabri@gmail.com" }
]
keywords = [
    "mcp",
    "model-context-protocol",
    "mcp-server",
    "google-play",
    "google-play-console",
    "google-play-developer-api",
    "android-publisher",
    "play-developer-reporting",
    "android",
    "android-vitals",
    "play-store",
    "app-release",
    "release-automation",
    "aso",
    "app-store-optimization",
    "in-app-purchases",
    "subscriptions",
    "claude",
    "cursor",
    "ai-agent",
    "llm-tools",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "fastmcp==4.0.8",
    "google-api-python-client>=2.199.0",
    "google-auth>=2.56.3",
    # Play installs, ratings and earnings have no REST API: they exist only as
    # CSVs in a private Cloud Storage bucket. See docs/tools/reports.md.
    "google-cloud-storage>=3.13.1",
    # Public store search, charts, autocomplete and review history. The Reviews
    # API returns only ~1 week, so scraping is the only route to history.
    "play-store-scraper-ng>=0.1.8",
    "pydantic>=2.13.4",
    "structlog>=26.1.0",
    # pyjwt is a transitive dependency (via mcp). Declared directly with a
    # secure floor so the CVE-2026-32597 fix ships in published metadata,
    # not just in this repo's lockfile/uv resolution.
    "pyjwt[crypto]>=2.13.0",
    # OS keychain storage for service-account keys. Already present as a
    # transitive dependency of fastmcp, but declared directly because
    # google_play_console_mcp.keychain imports it in its own right.
    "keyring>=25.7.0",
    # Same reasoning: server.py imports both directly for the HTTP transport,
    # the /health and /credentials routes and the TrustedHost middleware. They
    # arrive transitively via fastmcp today, so nothing breaks until fastmcp
    # changes what it pins — at which point this server stops importing.
    "starlette>=0.42.0",
    "uvicorn>=0.34.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.4",
    "mypy>=2.3.1",
    "fastmcp[code-mode]==4.0.8",
    # Property-based tests for the Data Safety CSV parser. Example-based tests
    # cover the formats we thought of; this covers the ones we did not, and it
    # is how the unhandled _csv.Error on an oversized field was found.
    "hypothesis>=6.165.0",
]
code-mode = [
    "fastmcp[code-mode]==4.0.8",
]

[project.scripts]
google-play-console-mcp = "google_play_console_mcp:main"

[project.urls]
Homepage = "https://github.com/abd3lraouf-studios/google-play-console-mcp"
Documentation = "https://github.com/abd3lraouf-studios/google-play-console-mcp/tree/main/docs"
Repository = "https://github.com/abd3lraouf-studios/google-play-console-mcp"
Issues = "https://github.com/abd3lraouf-studios/google-play-console-mcp/issues"
Changelog = "https://github.com/abd3lraouf-studios/google-play-console-mcp/blob/main/CHANGELOG.md"

# LICENSES/ is force-included rather than left to the backend's license-files
# handling, which varies by hatchling version and silently shipped only
# LICENSE on 1.27. The MIT terms of the third-party code under LICENSES/
# require those texts to ship with every distribution, so their presence must
# not depend on a backend feature.
[tool.hatch.build.targets.wheel.force-include]
"LICENSES" = "google_play_console_mcp/LICENSES"

[tool.hatch.build.targets.wheel]
packages = ["src/google_play_console_mcp"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/LICENSES/",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "PTH",    # flake8-use-pathlib
    "RUF",    # Ruff-specific rules
    "S",      # flake8-bandit (security)
    "BLE",    # flake8-blind-except
    "TRY",    # tryceratops
    "PERF",   # perflint
    "PIE",    # flake8-pie
    "PLC",    # pylint convention
    "SLF",    # flake8-self
    "C90",    # mccabe complexity
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "B904",   # raise without from inside except
    "S101",   # assert in tests (expected for pytest)
    "TRY003", # long exception messages
    "TRY300", # return in try block (intentional pattern for API calls)
    "TRY301", # abstract raise to inner function
    "TC002",  # move third-party imports into type-checking block
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "SLF001",  # private member access (needed for testing internals)
    "S105",    # hardcoded passwords in test assertions
    "S106",    # hardcoded passwords in test fixtures
    "PLC0415", # imports inside test functions (intentional for test isolation)
    "BLE001",  # blind except in test scripts
    "C901",    # complexity in test scripts
    "PLR0912", # too many branches in test scripts
    "PLR0915", # too many statements in test scripts
    "S607",    # partial executable path (test scripts)
]
"src/google_play_console_mcp/server.py" = [
    "SLF001",  # accessing _get_service in lifespan is intentional
    "C901",    # complexity in update_credentials is acceptable
]
"src/google_play_console_mcp/client.py" = [
    "C901",    # complexity in _get_service is acceptable for credential handling
]

[tool.ruff.lint.isort]
known-first-party = ["google_play_console_mcp"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
strict = false
warn_return_any = true
warn_unused_ignores = false
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
show_error_codes = true
files = ["src/google_play_console_mcp"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = [
    "googleapiclient.*",
    "google.oauth2.*",
    "google.auth.*",
    "mcp.*",
]
ignore_missing_imports = true
disable_error_code = ["no-untyped-call"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# A list, not a string: a quoted -m expression inside a single addopts string
# survives pytest's own shlex parsing but breaks tools that re-split it
# (mutmut, for one, hands pytest a literal "'not" and fails to start).
addopts = ["-v", "--tb=short", "-m", "not network"]
markers = [
    # Hits a live Google discovery endpoint. Deselected by default so the suite
    # runs offline and in CI; run it with `-m network` to check for API drift.
    "network: reaches a live Google endpoint",
]
filterwarnings = [
    "ignore:cannot collect test class:pytest.PytestCollectionWarning",
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["src/google_play_console_mcp"]
branch = true
omit = ["*/__main__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.bandit]
skips = ["B101"]
exclude_dirs = ["tests"]
