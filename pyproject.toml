[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "google-play-console-mcp"
version = "0.6.0"
description = "MCP server for Google Play Console: 169 tools for releases, Android vitals, earnings, ASO and store assets, with a confirmation gate on destructive writes"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "Abdelraouf Sabri", email = "abdelraoufsabri@gmail.com" }
]
keywords = [
    "mcp",
    "model-context-protocol",
    "mcp-server",
    "google-play",
    "google-play-console",
    "google-play-developer-api",
    "android-publisher",
    "play-developer-reporting",
    "android",
    "android-vitals",
    "play-store",
    "app-release",
    "release-automation",
    "aso",
    "app-store-optimization",
    "in-app-purchases",
    "subscriptions",
    "claude",
    "cursor",
    "ai-agent",
    "llm-tools",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "fastmcp==4.0.0b3",
    "google-api-python-client>=2.180.0",
    "google-auth>=2.40.0",
    # Play installs, ratings and earnings have no REST API: they exist only as
    # CSVs in a private Cloud Storage bucket. See docs/tools/reports.md.
    "google-cloud-storage>=2.19.0",
    # Public store search, charts, autocomplete and review history. The Reviews
    # API returns only ~1 week, so scraping is the only route to history.
    "play-store-scraper-ng>=0.1.8",
    "pydantic>=2.10.0",
    "structlog>=25.0.0",
    # pyjwt is a transitive dependency (via mcp). Declared directly with a
    # secure floor so the CVE-2026-32597 fix ships in published metadata,
    # not just in this repo's lockfile/uv resolution.
    "pyjwt[crypto]>=2.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
    "fastmcp[code-mode]==4.0.0b3",
]
code-mode = [
    "fastmcp[code-mode]==4.0.0b3",
]

[project.scripts]
google-play-console-mcp = "google_play_console_mcp:main"

[project.urls]
Homepage = "https://github.com/abd3lraouf-studios/google-play-console-mcp"
Documentation = "https://abd3lraouf-studios.github.io/google-play-console-mcp/"
Repository = "https://github.com/abd3lraouf-studios/google-play-console-mcp"
Issues = "https://github.com/abd3lraouf-studios/google-play-console-mcp/issues"
Changelog = "https://github.com/abd3lraouf-studios/google-play-console-mcp/blob/main/CHANGELOG.md"
Upstream = "https://github.com/lusky3/play-store-mcp"

[tool.hatch.build.targets.wheel]
packages = ["src/google_play_console_mcp"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/LICENSE",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "PTH",    # flake8-use-pathlib
    "RUF",    # Ruff-specific rules
    "S",      # flake8-bandit (security)
    "BLE",    # flake8-blind-except
    "TRY",    # tryceratops
    "PERF",   # perflint
    "PIE",    # flake8-pie
    "PLC",    # pylint convention
    "SLF",    # flake8-self
    "C90",    # mccabe complexity
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "B904",   # raise without from inside except
    "S101",   # assert in tests (expected for pytest)
    "TRY003", # long exception messages
    "TRY300", # return in try block (intentional pattern for API calls)
    "TRY301", # abstract raise to inner function
    "TC002",  # move third-party imports into type-checking block
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "SLF001",  # private member access (needed for testing internals)
    "S105",    # hardcoded passwords in test assertions
    "S106",    # hardcoded passwords in test fixtures
    "PLC0415", # imports inside test functions (intentional for test isolation)
    "BLE001",  # blind except in test scripts
    "C901",    # complexity in test scripts
    "PLR0912", # too many branches in test scripts
    "PLR0915", # too many statements in test scripts
    "S607",    # partial executable path (test scripts)
]
"src/google_play_console_mcp/server.py" = [
    "SLF001",  # accessing _get_service in lifespan is intentional
    "C901",    # complexity in update_credentials is acceptable
]
"src/google_play_console_mcp/client.py" = [
    "C901",    # complexity in _get_service is acceptable for credential handling
]

[tool.ruff.lint.isort]
known-first-party = ["google_play_console_mcp"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
strict = false
warn_return_any = true
warn_unused_ignores = false
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
show_error_codes = true
files = ["src/google_play_console_mcp"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = [
    "googleapiclient.*",
    "google.oauth2.*",
    "google.auth.*",
    "mcp.*",
]
ignore_missing_imports = true
disable_error_code = ["no-untyped-call"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-v --tb=short"
filterwarnings = [
    "ignore:cannot collect test class:pytest.PytestCollectionWarning",
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["src/google_play_console_mcp"]
branch = true
omit = ["*/__main__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.bandit]
skips = ["B101"]
exclude_dirs = ["tests"]
